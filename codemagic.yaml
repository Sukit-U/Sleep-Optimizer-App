workflows:
  android-workflow:
    name: Android Workflow (Beta — sleep-optimizer-dev)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        # Must match the name the keystore was uploaded under in Codemagic
        # (App settings → Code signing identities → Android keystore).
        - snoozefriend_upload
      # `google_play` group (service account) temporarily disabled while the
      # Play Console account/app is being set up. Re-enable by restoring the
      # group and the `publishing.google_play` block below.
      # groups:
      #   - google_play
      vars:
        # Beta distribution targets `sleep-optimizer-dev` (`APP_ENV=dev`,
        # flavor `dev`) so beta test data stays isolated from production
        # (`sleep-optimizer-59c83`, which currently has PITR disabled and no
        # automated backups). Switch to `APP_ENV: "prod"`, `--flavor prod`, and
        # `PACKAGE_NAME: "com.snoozefriend.snoozemate"` only for production Play
        # Store releases after Blaze + PITR + daily backups are enabled.
        APP_ENV: "dev"
        PACKAGE_NAME: "com.snoozefriend.snoozemate.dev"
        # GOOGLE_PLAY_TRACK: "internal"
      flutter: 3.44.8 # keep in step with .github/workflows/ci.yml
    triggering:
      # Runs on release and beta tags (`v*`, including `v*-beta.*`).
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Set up Android signing
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Flutter unit tests
        script: |
          flutter test
      - name: Derive Android build name and build number
        script: |
          set -eu
          RAW_TAG="${CM_TAG:-}"
          if [ -n "$RAW_TAG" ]; then
            VERSION_FIELDS=$(sh scripts/android-release-version.sh --allow-beta "$RAW_TAG")
            BUILD_NAME=$(printf '%s\n' "$VERSION_FIELDS" | sed -n 's/^version_name=//p')
            ANDROID_VERSION_CODE=$(printf '%s\n' "$VERSION_FIELDS" | sed -n 's/^version_code=//p')
          else
            BUILD_NAME=$(awk '/^version:/ { split($2, a, "+"); print a[1]; exit }' pubspec.yaml)
            ANDROID_VERSION_CODE="${BUILD_NUMBER:-1}"
          fi
          if [ -z "$BUILD_NAME" ] || [ -z "$ANDROID_VERSION_CODE" ]; then
            echo "error: could not derive Android BUILD_NAME or ANDROID_VERSION_CODE from CM_TAG or pubspec.yaml" >&2
            exit 1
          fi
          echo "Derived Android BUILD_NAME=$BUILD_NAME ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE APP_ENV=$APP_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$CM_ENV"
      - name: Build Android App Bundle and APK (dev beta)
        script: |
          flutter build appbundle --flavor dev --release \
            --dart-define=APP_ENV=$APP_ENV \
            --build-name="$BUILD_NAME" \
            --build-number="$ANDROID_VERSION_CODE"
          flutter build apk --flavor dev --release \
            --dart-define=APP_ENV=$APP_ENV \
            --build-name="$BUILD_NAME" \
            --build-number="$ANDROID_VERSION_CODE"
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - kaka040352@gmail.com
        notify:
          success: true
          failure: false
      # Temporarily disabled: no Play service account configured yet.
      # google_play:
      #   credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      #   track: $GOOGLE_PLAY_TRACK
      #   submit_as_draft: true

  ios-workflow:
    name: iOS TestFlight Beta Workflow (sleep-optimizer-dev)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.snoozefriend.snoozemate
      vars:
        # TestFlight beta targets `sleep-optimizer-dev` (`APP_ENV=dev`) because
        # production (`sleep-optimizer-59c83`) is on Spark with PITR disabled
        # and no backups (see docs/INCIDENT_sleepplans-delete.md and
        # docs/ENVIRONMENTS.md). iOS uses the single bundle identifier
        # `com.snoozefriend.snoozemate` for both dev and prod Firebase projects.
        # Switch `APP_ENV` to `"prod"` only for App Store production releases
        # after Blaze + PITR + daily backups are enabled on production.
        # App Store Connect → Apps → Snoozemate → General → App Information →
        # Apple ID (10-digit numeric ID). Configure `APP_STORE_APPLE_ID` in
        # Codemagic Environment variables (it is intentionally omitted here so
        # `vars:` does not shadow a Codemagic UI variable group) so
        # `app-store-connect get-latest-testflight-build-number` can query the
        # latest uploaded build number and auto-increment beyond it.
        APP_ENV: "dev"
      flutter: 3.44.8 # keep in step with .github/workflows/ci.yml
      xcode: latest
      cocoapods: default
    triggering:
      # Publishes to App Store Connect / TestFlight on release and beta tags
      # (`v*`, including `v1.0.0-beta.1`).
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Flutter unit tests
        script: |
          flutter test
      - name: Derive iOS build name and build number
        script: |
          set -eu
          # App Store Connect requires CFBundleShortVersionString (--build-name)
          # to be strictly numeric MAJOR.MINOR.PATCH (no `-beta.N` suffix).
          RAW_TAG="${CM_TAG:-}"
          if [ -n "$RAW_TAG" ]; then
            BUILD_NAME=$(printf '%s' "$RAW_TAG" | sed -E 's/^v//; s/-.*$//')
          else
            BUILD_NAME=$(awk '/^version:/ { split($2, a, "+"); print a[1]; exit }' pubspec.yaml | sed -E 's/-.*$//')
          fi
          if ! printf '%s' "$BUILD_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: derived iOS BUILD_NAME '$BUILD_NAME' is not numeric MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          # Never reuse static 1.0.0+1 from pubspec.yaml. Query App Store
          # Connect for the latest TestFlight build number when
          # APP_STORE_APPLE_ID is configured, and ensure the new build number is
          # strictly greater than both the latest TestFlight build and
          # Codemagic's monotonically increasing $BUILD_NUMBER.
          BUILD_NUM="${BUILD_NUMBER:-1}"
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST_TESTFLIGHT=""
            ASC_STATUS=0
            LATEST_TESTFLIGHT=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>&1) || ASC_STATUS=$?
            if [ "$ASC_STATUS" -ne 0 ]; then
              if printf '%s' "$LATEST_TESTFLIGHT" | grep -qiE "no builds|not found"; then
                echo "No existing TestFlight build found; using Codemagic BUILD_NUMBER=$BUILD_NUM"
              else
                echo "error: app-store-connect get-latest-testflight-build-number failed (exit $ASC_STATUS): $LATEST_TESTFLIGHT" >&2
                exit 1
              fi
            else
              case "$LATEST_TESTFLIGHT" in
                ''|*[!0-9]*)
                  echo "No numeric TestFlight build returned ('$LATEST_TESTFLIGHT'); using Codemagic BUILD_NUMBER=$BUILD_NUM"
                  ;;
                *)
                  NEXT_TESTFLIGHT=$((LATEST_TESTFLIGHT + 1))
                  if [ "$NEXT_TESTFLIGHT" -gt "$BUILD_NUM" ]; then
                    BUILD_NUM="$NEXT_TESTFLIGHT"
                  fi
                  ;;
              esac
            fi
          else
            echo "warning: APP_STORE_APPLE_ID is not set in Codemagic environment variables; skipping TestFlight lookup and using BUILD_NUMBER=$BUILD_NUM" >&2
          fi

          echo "Derived iOS BUILD_NAME=$BUILD_NAME BUILD_NUM=$BUILD_NUM APP_ENV=$APP_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"
          echo "BUILD_NUM=$BUILD_NUM" >> "$CM_ENV"
      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --dart-define=APP_ENV=$APP_ENV \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUM" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - kaka040352@gmail.com
        notify:
          success: true
          failure: false
      # Requires the `codemagic` App Store Connect API Key integration (Developer
      # Portal / App Store Connect → Users and Access → Integrations → Keys) and
      # an active app record for `com.snoozefriend.snoozemate`. See
      # docs/IOS_TESTFLIGHT_DISTRIBUTION.md for the full external setup checklist.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Proves the archive guard on real macOS/Xcode without signing or publishing:
  # `xcodebuild` runs shell build phases even with --no-codesign, so the
  # "Verify APP_ENV" phase is exercised without a keychain, a certificate or any
  # secret. No publishing block, and it is scoped to the branch under review.
  ios-verify-archive-guard:
    name: iOS verify APP_ENV guard (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        # Non-secret value, kept in repo per Codemagic guidance.
        APP_ENV: "prod"
      flutter: 3.44.8 # keep in step with .github/workflows/ci.yml
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'feat/ios-release-path'
          include: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: "Positive case: release build with APP_ENV=prod passes the phase"
        script: |
          flutter build ios --release --no-codesign --dart-define=APP_ENV=$APP_ENV
      - name: "Negative case: release build with no APP_ENV fails the Xcode phase"
        script: |
          flutter clean
          flutter pub get
          set +e
          flutter build ios --release --no-codesign > no-app-env.log 2>&1
          status=$?
          set -e
          tail -60 no-app-env.log
          if [ "$status" -eq 0 ]; then
            echo "error: Verify APP_ENV did not fail the unsigned release build"
            exit 1
          fi
          if ! grep -qE "no --dart-define=APP_ENV|Verify APP_ENV" no-app-env.log; then
            echo "error: the build failed, but not in the Verify APP_ENV phase"
            exit 1
          fi
    artifacts:
      - no-app-env.log

  # Unsigned iOS compile check that runs on main (and PRs) without any Apple
  # credentials, mirroring .github/workflows/ci.yml's build-ios job. Proves the
  # Xcode project, Podfile and Firebase options compile on a macOS host.
  ios-unsigned:
    name: iOS unsigned compile check (main)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        # Non-secret value, kept in repo per Codemagic guidance.
        APP_ENV: "prod"
      flutter: 3.44.8 # keep in step with .github/workflows/ci.yml
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Flutter unit tests
        script: |
          flutter test
      - name: Build iOS (unsigned, prod config)
        script: |
          flutter build ios --release --no-codesign --dart-define=APP_ENV=$APP_ENV
    artifacts:
      - flutter_drive.log
