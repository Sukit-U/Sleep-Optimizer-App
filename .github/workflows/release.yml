name: Release

# Production artifacts only. Every build here is tagged `v*` and produces the
# prod flavor; branch/PR checks live in ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with ci.yml / the SDK used locally.
  FLUTTER_VERSION: '3.44.8'
# Production build identity: --flavor prod selects
# android/app/src/prod/google-services.json (sleep-optimizer-59c83) and
# --dart-define=APP_ENV=prod selects lib/firebase_options.dart. The two must
# always travel together on every build below.

jobs:
  verify:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build prod AAB + APK
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      # Repository secrets (Settings → Secrets and variables → Actions).
      # See docs/RELEASE_SIGNING.md §5; without them the artifacts are unsigned.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Warn when signing secrets are missing
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — these artifacts will be UNSIGNED"

      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<PROPERTIES
          storeFile=upload-keystore.jks
          keyAlias=upload
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPERTIES

      - name: Build App Bundle
        run: flutter build appbundle --release --flavor prod --dart-define=APP_ENV=prod

      - name: Build APK
        run: flutter build apk --release --flavor prod --dart-define=APP_ENV=prod

      # Flavored outputs are named app-<flavor>-<buildType>.* and live under a
      # <flavor><BuildType> directory.
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-apk
          # Glob, because Gradle appends "-unsigned" when the signing secrets
          # are absent (see docs/RELEASE_SIGNING.md).
          path: build/app/outputs/flutter-apk/app-prod-release*.apk
          if-no-files-found: error
          retention-days: 14
