name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Tag builds are production releases: see release.yml.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the SDK used locally (`flutter --version`), so analyze and
  # test results mean the same thing on a laptop and on the runner.
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Release builds take their version from a tag; these rules decide
      # versionName/versionCode, so a broken one must fail before it ships.
      - name: Check the release version rules
        run: sh scripts/android-release-version.sh --self-test

  # Fails the build when a real credential is committed — in the working tree
  # or in any commit the pull request adds. The scanner is pinned and checksum
  # verified, and every finding is printed with --redact so a live secret never
  # reaches the Actions log.
  #
  # gitleaks is deliberately run from its BSD-3 release binary rather than the
  # marketplace action: the action requires a paid GITLEAKS_LICENSE for
  # organisations, and a licence failure would silently weaken the guard.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # A stalled download in the install step must not burn the default 6h.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the pull-request range below can be resolved.
          fetch-depth: 0
          # This job only reads; keep the token out of .git/config.
          persist-credentials: false

      # Downloads into $RUNNER_TEMP, never into the workspace: the scan below
      # runs over ".", so an archive left in the checkout would be unpacked by
      # --max-archive-depth and its own README (which shows example findings)
      # would be reported as if it were repository content.
      - name: Install gitleaks (pinned + checksum verified)
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP:?}/gitleaks-${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          mkdir -p "$bin_dir"
          cd "$bin_dir"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/gitleaks" version

      # Whole tree, so a key that lands in a file the diff would not highlight
      # (renames, generated config) is still caught. Archives are unpacked and
      # scanned too, since a committed .zip is an easy way to smuggle one.
      - name: Scan files
        run: >-
          gitleaks dir . --config .gitleaks.toml
          --redact --no-banner --verbose --exit-code 1 --max-archive-depth=2

      # Only the commits this pull request adds, so unrelated history can never
      # fail someone else's change.
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          gitleaks git . --config .gitleaks.toml
          --redact --no-banner --verbose --exit-code 1
          --log-opts="${BASE_SHA}..HEAD"

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-rules-test
    steps:
      - uses: actions/checkout@v7

      # The Firestore emulator needs Java 11+; firebase-tools (spawned by
      # `npm test` via `npx firebase emulators:exec`) needs 21+. setup-java also
      # exports JAVA_HOME, which the local runner script prefers over its
      # Windows default.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firestore-rules-test/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests
        run: npm test

  build-android:
    name: Build dev debug APK
    needs: [analyze-and-test, rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --flavor selects android/app/src/dev/google-services.json, the
      # dart-define selects lib/firebase_options_dev.dart. Both are required.
      - name: Build dev debug APK
        run: flutter build apk --debug --flavor dev --dart-define=APP_ENV=dev

      - name: Upload dev debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-dev-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 7

  # iOS compile check only. `--no-codesign` keeps signing material and every
  # credential out of CI, so this proves the Xcode project, the Podfile and the
  # Firebase options compile on a macOS host — not that a signed build is
  # shippable. It builds APP_ENV=prod because that is the only iOS Firebase app
  # this repository has config for; a dev iOS build stops at startup until the
  # dev iOS app is registered (docs/ENVIRONMENTS.md).
  build-ios:
    name: Build iOS (unsigned, prod config)
    needs: [analyze-and-test, rules]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The Xcode phase cannot run here (no Xcode), but its check is plain
      # shell: prove it fails an app-less Release build and passes Debug and
      # an explicit APP_ENV=prod before trusting the behaviour above.
      - name: Check the archive guard
        run: |
          if CONFIGURATION=Release sh ios/scripts/verify_app_env.sh; then
            echo "::error::the archive guard passed without --dart-define=APP_ENV"
            exit 1
          fi
          CONFIGURATION=Release DART_DEFINES=QVBQX0VOVj1wcm9k \
            sh ios/scripts/verify_app_env.sh
          CONFIGURATION=Debug sh ios/scripts/verify_app_env.sh

      - name: Build iOS release without code signing
        run: flutter build ios --release --no-codesign --dart-define=APP_ENV=prod

      # Negative case: the same Release build with no APP_ENV must fail inside the
      # Xcode "Verify APP_ENV" phase, not only at launch. `flutter clean` first so
      # no cached output can stand in for a rebuilt app, and the failure message is
      # asserted so a different breakage cannot pass for a working guard.
      - name: Prove an iOS release build without APP_ENV fails the Xcode phase
        run: |
          flutter clean
          flutter pub get
          set +e
          flutter build ios --release --no-codesign > "$RUNNER_TEMP/no-app-env.log" 2>&1
          status=$?
          set -e
          tail -60 "$RUNNER_TEMP/no-app-env.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::Verify APP_ENV did not fail the unsigned release build"
            exit 1
          fi
          if ! grep -qE "no --dart-define=APP_ENV|Verify APP_ENV" "$RUNNER_TEMP/no-app-env.log"; then
            echo "::error::the build failed, but not in the Verify APP_ENV phase"
            exit 1
          fi
